kind = "mobile"
previewPath = "/shoulder-rehab-patient/"
title = "AI Digital Twin Physiotherapy"
description = "A mobile AI Digital Twin physiotherapy platform with separate patient and physiotherapist workspaces, shared rehabilitation plans, sessions, progress, and pose-analysis tooling."
version = "1.0.0"
id = "artifacts/shoulder-rehab-patient"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/shoulder-rehab-patient/" ]
localPort = 20886

[services.development]
run = "pnpm --filter @workspace/shoulder-rehab-patient run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shoulder-rehab-patient", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/shoulder-rehab-patient", "run", "serve" ]

[services.env]
PORT = "20886"
BASE_PATH = "/shoulder-rehab-patient/"
