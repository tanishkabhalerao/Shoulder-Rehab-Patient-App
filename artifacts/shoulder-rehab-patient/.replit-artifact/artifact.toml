kind = "mobile"
previewPath = "/shoulder-rehab-patient/"
title = "Shoulder Rehab Patient"
description = "A patient-facing mobile app for assigned shoulder physiotherapy exercises, camera-ready movement sessions, performance tracking, and communication with a physiotherapist."
version = "1.0.0"
id = "artifacts/shoulder-rehab-patient"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/shoulder-rehab-patient/" ]
localPort = 20886

[services.development]
run = "pnpm --filter @workspace/shoulder-rehab-patient run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shoulder-rehab-patient", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/shoulder-rehab-patient", "run", "serve" ]

[services.env]
PORT = "20886"
BASE_PATH = "/shoulder-rehab-patient/"
